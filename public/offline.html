<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>オフライン - union資材発注</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <style>
      :root {
        --bg: #fafaf9;
        --surface: #ffffff;
        --border: #e7e5e4;
        --foreground: #0c0a09;
        --muted: #57534e;
        --accent: #06b6d4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Zen Kaku Gothic New", sans-serif;
        background: var(--bg);
        color: var(--foreground);
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 16px);
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #ecfeff;
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        appearance: none;
        border: 0;
        background: #0c0a09;
        color: #fafaf9;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        min-height: 44px;
        min-width: 44px;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
        <h1>オフラインです</h1>
        <p>ネットワーク接続を確認してから<br />再度お試しください。</p>
        <button type="button" onclick="location.reload()">再読み込み</button>
      </div>
    </div>
  </body>
</html>
