name: CI

on:
  push:
    branches:
      - oken
  pull_request:
    branches:
      - oken

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OKEN_DATABASE_URL: ${{ secrets.OKEN_DATABASE_URL }}
      OKEN_DIRECT_URL: ${{ secrets.OKEN_DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint
